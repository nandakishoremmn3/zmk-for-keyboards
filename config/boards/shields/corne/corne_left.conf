# ZMK Studio configuration for the Master side
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Enable WPM tracking engine and layout widget calculation ONLY on Left side
CONFIG_ZMK_WPM=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Physical RGB hardware explicitly turned off
CONFIG_ZMK_RGB_UNDERGLOW=n
